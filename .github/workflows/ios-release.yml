name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Resolve tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tag and toolchain
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcodebuild -version | grep -q '^Xcode 27\.'
          xcodebuild -showsdks | grep -Eq 'iphoneos27\.[0-9]+'

      - name: Verify behavior and coverage
        run: |
          sh scripts/check-state.sh
          sh scripts/check-downloads.sh
          bash scripts/check-refactor.sh

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project Wisimi.xcodeproj \
            -scheme Wisimi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned ipa
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Wisimi.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/release/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/release/Payload/Wisimi.app"
          (cd "$RUNNER_TEMP/release" && ditto -c -k --norsrc --keepParent Payload "Wisimi-${RELEASE_TAG}-unsigned.ipa")
          IPA="$RUNNER_TEMP/release/Wisimi-${RELEASE_TAG}-unsigned.ipa"
          unzip -t "$IPA"
          unzip -Z1 "$IPA" | grep -Fx 'Payload/Wisimi.app/Wisimi'

      - name: Save build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Wisimi-${{ env.RELEASE_TAG }}-unsigned
          path: ${{ runner.temp }}/release/Wisimi-${{ env.RELEASE_TAG }}-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="$RUNNER_TEMP/release/Wisimi-${RELEASE_TAG}-unsigned.ipa"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' '未签名 IPA，需自行签名后侧载。' > "$NOTES_FILE"
          if [[ -f CHANGELOG.md ]]; then
            awk -v version="${RELEASE_TAG#v}" '
              $0 == "## " version { include = 1; next }
              include && /^## / { exit }
              include { print }
            ' CHANGELOG.md >> "$NOTES_FILE"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPA" --clobber
          else
            gh release create "$RELEASE_TAG" "$IPA" --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
